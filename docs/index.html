<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanaor Creative Arena</title>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --card-hover: #222633;
  --border: #2a2e3d;
  --text: #e4e4e7;
  --text-dim: #8b8d97;
  --gold: #f5a623;
  --gold-glow: rgba(245,166,35,.18);
  --green: #22c55e;
  --green-dim: rgba(34,197,94,.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,.12);
  --blue: #3b82f6;
  --purple: #a855f7;
  --superstar: linear-gradient(135deg, #f5a623, #f97316);
  --winner: linear-gradient(135deg, #22c55e, #10b981);
  --rising: linear-gradient(135deg, #3b82f6, #6366f1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
}
.container { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }

/* Header */
.header {
  text-align: center;
  padding: 40px 0 32px;
  position: relative;
}
.header h1 {
  font-size: 2.4rem;
  font-weight: 800;
  background: linear-gradient(135deg, #f5a623, #f97316, #ef4444);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}
.header .subtitle {
  color: var(--text-dim);
  font-size: 1rem;
  margin-top: 6px;
}
.header .last-updated {
  color: var(--text-dim);
  font-size: 0.8rem;
  margin-top: 12px;
  opacity: 0.6;
}
.campaign-badge {
  display: inline-block;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 16px;
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-top: 12px;
}

/* Stats bar */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin: 32px 0;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}
.stat-card .label { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
.stat-card .value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
.stat-card .sub { color: var(--text-dim); font-size: 0.75rem; margin-top: 2px; }

/* Leaderboard */
.section-title {
  font-size: 1.3rem;
  font-weight: 700;
  margin: 40px 0 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-title .icon { font-size: 1.5rem; }

.leaderboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 16px;
  margin-bottom: 40px;
}
.leader-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}
.leader-card:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
}
.leader-card.rank-1 { border-color: var(--gold); box-shadow: 0 0 30px var(--gold-glow); }
.leader-card.rank-1 .rank-badge { background: var(--superstar); }
.leader-card.rank-2 .rank-badge { background: linear-gradient(135deg, #94a3b8, #64748b); }
.leader-card.rank-3 .rank-badge { background: linear-gradient(135deg, #b45309, #92400e); }

.rank-badge {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.85rem;
  background: var(--border);
}
.leader-name {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.leader-bonus {
  font-size: 2rem;
  font-weight: 800;
  color: var(--gold);
  margin: 12px 0;
}
.leader-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.leader-stat { font-size: 0.8rem; }
.leader-stat .num { font-weight: 700; color: var(--text); }
.leader-stat .lbl { color: var(--text-dim); }
.badge-superstar, .badge-winner, .badge-rising, .badge-testing {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge-superstar { background: var(--gold-glow); color: var(--gold); border: 1px solid var(--gold); }
.badge-winner { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
.badge-rising { background: rgba(59,130,246,.12); color: var(--blue); border: 1px solid var(--blue); }
.badge-testing { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }

/* Creatives table */
.table-wrapper {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
thead th {
  background: #14161e;
  padding: 14px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  font-size: 0.7rem;
  letter-spacing: 1px;
  position: sticky;
  top: 0;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
thead th:hover { color: var(--text); }
thead th.sorted-asc::after { content: ' ▲'; color: var(--gold); }
thead th.sorted-desc::after { content: ' ▼'; color: var(--gold); }
tbody tr {
  border-top: 1px solid var(--border);
  transition: background 0.15s;
}
tbody tr:hover { background: var(--card-hover); }
tbody td { padding: 12px 16px; white-space: nowrap; }
.creative-name {
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}
.vs-avg {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  margin-left: 6px;
}
.vs-avg.positive { background: var(--green-dim); color: var(--green); }
.vs-avg.negative { background: var(--red-dim); color: var(--red); }
.creator-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 600;
  background: rgba(168,85,247,.12);
  color: var(--purple);
  border: 1px solid rgba(168,85,247,.25);
}

/* Filters */
.filters {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 500;
  transition: all 0.15s;
}
.filter-btn:hover, .filter-btn.active {
  border-color: var(--gold);
  color: var(--gold);
  background: var(--gold-glow);
}
.search-input {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 0.8rem;
  outline: none;
  width: 220px;
  transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--gold); }
.search-input::placeholder { color: var(--text-dim); }

/* Responsive */
@media (max-width: 768px) {
  .header h1 { font-size: 1.6rem; }
  .leaderboard { grid-template-columns: 1fr; }
  .stats-bar { grid-template-columns: 1fr 1fr; }
  .container { padding: 16px 12px; }
  table { font-size: 0.75rem; }
  tbody td, thead th { padding: 10px 10px; }
}
</style>
</head>

function fmt$(n) { return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0}); }
function fmtPct(n) { return n.toFixed(1) + '%'; }
function vsAvg(val, avgVal) {
  if (!avgVal || !val) return '';
  const diff = ((val - avgVal) / avgVal * 100);
  const cls = diff >= 0 ? 'positive' : 'negative';
  const sign = diff >= 0 ? '+' : '';
  return `<span class="vs-avg ${cls}">${sign}${diff.toFixed(0)}%</span>`;
}

    <div class="sub">Account average</div>
  </div>
  <div class="stat-card">
    <div class="label">Avg Hold Rate</div>
    <div class="value">${fmtPct(avg.avg_hold_rate)}</div>
    <div class="sub">Account average</div>
  </div>
`;

// Leaderboard
const sorted = Object.entries(DATA.leaderboard)
  .sort((a,b) => b[1].bonus - a[1].bonus || b[1].total_spend - a[1].total_spend);

document.getElementById('leaderboard').innerHTML = sorted.map(([name, d], i) => `
  <div class="leader-card rank-${i+1}">
    <div class="rank-badge">${i+1}</div>
    <div class="leader-name">${name}</div>
    <div style="color:var(--text-dim);font-size:0.8rem">${d.num_ads} creatives</div>
    <div class="leader-bonus">${fmt$(d.bonus)}</div>
    <div class="leader-stats">
      <div class="leader-stat"><div class="num">${fmt$(d.total_spend)}</div><div class="lbl">Total Spend</div></div>
      <div class="leader-stat"><div class="num">${d.winners + d.superstars}</div><div class="lbl">Winners</div></div>
      <div class="leader-stat"><div class="num" style="color:var(--gold)">${d.superstars}</div><div class="lbl">Superstars</div></div>
      <div class="leader-stat"><div class="num" style="color:var(--green)">${d.winners}</div><div class="lbl">$2.5K+</div></div>
    </div>
  </div>
`).join('');

// Filters
let activeCreator = 'ALL';
let activeTier = 'ALL';
let searchQuery = '';

function renderFilters() {
  const creators = ['ALL', ...participants];
  const tiers = ['ALL', 'superstar', 'winner', 'rising', 'testing'];
  document.getElementById('filters').innerHTML = `
    <input class="search-input" placeholder="Search creative name..." oninput="searchQuery=this.value.toLowerCase();renderTable()">
    ${creators.map(c => `<button class="filter-btn ${activeCreator===c?'active':''}" onclick="activeCreator='${c}';renderFilters();renderTable()">${c === 'ALL' ? 'All Creators' : c}</button>`).join('')}
    ${tiers.map(t => `<button class="filter-btn ${activeTier===t?'active':''}" onclick="activeTier='${t}';renderFilters();renderTable()">${t === 'ALL' ? 'All Tiers' : t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}
  `;
}

// Table
const columns = [
  { key: 'tier', label: 'Tier', render: (a) => tierBadge(a.tier) },
  { key: 'creator', label: 'Creator', render: (a) => `<span class="creator-tag">${a.creator}</span>` },
  { key: 'name', label: 'Creative', render: (a) => `<span class="creative-name" title="${a.name}">${a.name}</span>` },
  { key: 'spend', label: 'Spend', render: (a) => `${fmt$(a.spend)} ${vsAvg(a.spend, avg.avg_spend)}` },
  { key: 'hook_rate', label: 'Hook Rate', render: (a) => a.hook_rate ? `${fmtPct(a.hook_rate)} ${vsAvg(a.hook_rate, avg.avg_hook_rate)}` : '—' },
  { key: 'hold_rate', label: 'Hold Rate', render: (a) => a.hold_rate ? `${fmtPct(a.hold_rate)} ${vsAvg(a.hold_rate, avg.avg_hold_rate)}` : '—' },
  { key: 'impressions', label: 'Impressions', render: (a) => a.impressions.toLocaleString() },
  { key: 'three_sec_plays', label: '3s Plays', render: (a) => a.three_sec_plays.toLocaleString() },
  { key: 'thruplay', label: 'ThruPlay', render: (a) => a.thruplay.toLocaleString() },
];

let sortKey = 'spend';
let sortDir = 'desc';

function renderHead() {
  document.getElementById('tableHead').innerHTML = '<tr>' + columns.map(c =>
    `<th class="${sortKey===c.key ? (sortDir==='asc'?'sorted-asc':'sorted-desc') : ''}" onclick="toggleSort('${c.key}')">${c.label}</th>`
  ).join('') + '</tr>';
}

function toggleSort(key) {
  if (sortKey === key) sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  else { sortKey = key; sortDir = 'desc'; }
  renderHead();
  renderTable();
}

function renderTable() {
  let ads = DATA.ads.filter(a => participants.includes(a.creator));
  if (activeCreator !== 'ALL') ads = ads.filter(a => a.creator === activeCreator);
  if (activeTier !== 'ALL') ads = ads.filter(a => a.tier === activeTier);
  if (searchQuery) ads = ads.filter(a => a.name.toLowerCase().includes(searchQuery));

  ads.sort((a,b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if (sortDir === 'desc') return va > vb ? -1 : va < vb ? 1 : 0;
    return va < vb ? -1 : va > vb ? 1 : 0;
  });

  // Always put superstars first, then winners, when sorting by spend desc
  if (sortKey === 'spend' && sortDir === 'desc') {
    const tierOrder = { superstar: 0, winner: 1, rising: 2, testing: 3 };
    ads.sort((a,b) => {
      if (tierOrder[a.tier] !== tierOrder[b.tier]) return tierOrder[a.tier] - tierOrder[b.tier];
      return b.spend - a.spend;
    });
  }

  document.getElementById('tableBody').innerHTML = ads.map(a => {
    const rowStyle = a.tier === 'superstar' ? 'background:rgba(245,166,35,.06)' :
                     a.tier === 'winner' ? 'background:rgba(34,197,94,.04)' : '';
    return `<tr style="${rowStyle}">${columns.map(c => `<td>${c.render(a)}</td>`).join('')}</tr>`;
  }).join('');
}

renderFilters();
renderHead();
renderTable();
</script>

</body>
</html>
